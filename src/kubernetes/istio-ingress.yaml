apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cinemaabyss-gateway
  namespace: cinemaabyss
spec:
  selector:
    istio: ingressgateway            # должен совпадать с label у istio-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - cinemaabyss.example.com    # как в старом Ingress
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cinemaabyss-vs
  namespace: cinemaabyss
spec:
  hosts:
    - cinemaabyss.example.com
  gateways:
    - cinemaabyss-gateway
  http:
    - match:
        - uri:
            prefix: /api/users
      route:
        - destination:
            host: monolith.cinemaabyss.svc.cluster.local
            port:
              number: 8080

    - match:
        - uri:
            prefix: /api/proxy
      route:
        - destination:
            host: proxy-service.cinemaabyss.svc.cluster.local
            port:
              number: 8000

    - match:
        - uri:
            prefix: /api/movies
      route:
        - destination:
            host: movies-service.cinemaabyss.svc.cluster.local
            port:
              number: 8081

    - match:
        - uri:
            prefix: /api/events
      route:
        - destination:
            host: events-service.cinemaabyss.svc.cluster.local
            port:
              number: 8082
